            "@type": "Answer",

          "@type": "Question",

            "@type": "Answer",
            "text": "Sim. Não há fidelidade. Você pode cancelar sua assinatura a qualquer momento diretamente pelo painel, sem burocracia."
          }
        },
        {
          "@type": "Question",
          "name": "O que é o ranking Bronze, Silver, Gold e Platinum?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É o sistema de reputação do RepMatch para empresas. Empresas Bronze têm acesso básico; Silver, Gold e Platinum têm maior visibilidade e acesso a representantes mais qualificados. O ranking sobe conforme o histórico de contratações, avaliações recebidas e comissão oferecida."
          }
        },
        {
          "@type": "Question",
          "name": "Representantes precisam pagar para usar a plataforma?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O cadastro e o uso básico são gratuitos para representantes. Representantes podem se candidatar a vagas, montar perfil completo e ser encontrados pelas empresas sem pagar nada."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o desbloqueio de contato por R$29?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ao encontrar um representante de interesse na busca, você adiciona ao carrinho e paga R$29 por representante via PIX ou cartão. Após o pagamento, o telefone, e-mail, cidade e bio completa do representante são liberados imediatamente."

        },

          "name": "Posso importar minha base de clientes ou representantes?",

            "@type": "Answer",
            "text": "Sim. O RepMatch permite importar sua base existente de representantes ou clientes para facilitar a gestão e evitar duplicidades."
          }
